name: Clean up v1.0.0
# One-off: removes the DMG from the v1.0.0 release and rewrites its notes. Delete after it runs.
on:
  push:
    branches: ["claude/gifted-johnson-jpp0uh"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete-asset v1.0.0 Emblem.dmg -y || true
          cat > notes.md <<NOTES
          ## Install

          Open Terminal (press ⌘ Space, type "Terminal", press Return), paste this and press Return:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
          \`\`\`

          Needs a Mac with Apple silicon (M1 or later), macOS 14 or later, and Spotify.
          NOTES
          gh release edit v1.0.0 --notes-file notes.md
          gh release view v1.0.0
